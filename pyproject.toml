[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "langgraph-firebreak"
version = "0.2.0.dev0"
description = "Capture a LangGraph run and rebuild its structure from LangGraph's own records."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Firebreak contributors" }]
keywords = ["langgraph", "multi-agent", "provenance", "observability", "tracing", "agents"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "langgraph>=1.2,<2",
  "langchain-core>=1.6,<2",
  "pyyaml>=6",
]

[project.optional-dependencies]
openai = ["langchain-openai>=1.6,<2"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
firebreak = "firebreak.cli:main"

[project.urls]
Homepage = "https://github.com/GXG-CS/firebreak"

[tool.hatch.build.targets.wheel]
packages = ["firebreak"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
